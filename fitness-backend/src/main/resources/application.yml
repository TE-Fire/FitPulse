server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: fitpulse-backend
  profiles:
    active: dev

  # ============ 排除自动装配（未开发的模块 / 与无状态JWT鉴权冲突的默认配置） ============
  autoconfigure:
    exclude:
      # 无状态JWT鉴权，不需要Spring Security默认的内存UserDetails + 控制台打印随机密码
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      # AI模块未开发前，禁用Spring AI自动装配（避免api-key为空Assert抛错导致启动失败）
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

  # ============ 文件上传 ============
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # ============ Jackson ============
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

# ============ MyBatis-Plus ============
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.fitpulse.app.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开发期打印SQL，上线换NO_LOGGING
  global-config:
    db-config:
      id-type: ASSIGN_ID          # 雪花算法
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============ 自定义 JWT 配置（secret 放环境文件） ============
fitpulse:
  jwt:
    access-expire-minutes: 1440    # 24小时
    refresh-expire-minutes: 43200  # 30天
    header: Authorization
    prefix: "Bearer "

  # ============ 文件存储 ============
  storage:
    type: local                # 存储类型：local=本地磁盘降级 / minio=MinIO 对象存储
    upload-path: D:/FitPulseData/files   # 本地存储根路径（个人版无需 MinIO）

  # ============ AI 提示词模板 ============
  ai:
    plan-prompt-template: |
      你是一位专业健身教练。请为用户生成个性化训练计划。
      用户目标：{goal}（1减脂 2增肌 3塑形 4力量）
      可用器械：{equipment}
      每周训练天数：{daysPerWeek}
      训练经验：{level}（入门/初级/中级/高级）
      可用时间：{minutesPerDay} 分钟/次

      输出 JSON 格式，不要任何 Markdown：
      {
        "planName": "字符串",
        "daysPerWeek": 数字,
        "days": [
          {
            "dayNo": 1,
            "focus": "部位",
            "exercises": [
              {"name": "动作名", "sets": 3, "reps": "8-12", "restSec": 90}
            ]
          }
        ]
      }
    diet-prompt-template: |
      你是营养师。用户今日摄入：{todayMeals}，总热量 {totalKcal}kcal，
      目标：{goal}，每日目标热量 {targetKcal}kcal。
      用 3 句话给出评价和改进建议。

logging:
  level:
    com.fitpulse.app: debug
    org.springframework.security: info
